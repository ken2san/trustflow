# TrustFlow HTTP surface — DRAFT, 2026-11-08
#
# Status of this document
#   Every path is marked `x-trustflow-status: live` or `proposed`.
#   `live`     — describes what is deployed today, read off the source and the
#                four ACTIVE Edge Functions on production (all verify_jwt: true).
#   `proposed` — designed in docs/proposals/agent-first-access.md and NOT built.
#
#   Nothing here was generated from a running server, and no request in it was
#   executed against production. Treat the `live` half as a careful reading of
#   the code, not as a conformance report.
#
# Two origins, deliberately
#   The Edge Functions and PostgREST share the Supabase project origin; the web
#   app is on Vercel. An agent only ever needs the Supabase origin.
#
# Authorization, which is the part most likely to surprise an implementer
#   Every function has verify_jwt: true, so the PLATFORM GATEWAY validates
#   `Authorization: Bearer` before any TrustFlow code runs. The anon key
#   satisfies it. That is why a guest credential travels in `x-guest-access-token`
#   and why a delegation token must travel in `x-trustflow-delegation` rather
#   than in `Authorization` — the gateway would reject it first.
#
#   A custom header must also appear in Access-Control-Allow-Headers or browsers
#   fail the preflight; server-side callers do not preflight, so an API test
#   cannot see that break (see supabase/functions/log-event/index.ts).
#
#   `anonKey` and `ownerJwt` are two VALUES of the same `Authorization: Bearer`
#   header, never two headers, so they are alternatives and never combined.
#   Global security names anonKey, which is what the gateway requires; an
#   operation that needs a real account session overrides it with ownerJwt.

openapi: 3.1.0

info:
  title: TrustFlow evidence API (draft)
  version: 0.1.0-draft
  summary: Append-only, hash-chained evidence for two-party agreements.
  description: |
    TrustFlow records what each party STATED, with the server's time, bound to
    an exact agreement version by `agreement_hash`. It does not establish that
    any statement is true: not that work was delivered, not that money moved,
    and not the identity of whoever acted. Every response that carries evidence
    also carries what it does not prove, because a machine reader has no README.

    Payment and payout are out of scope for this document. The five retired
    payment and email functions must stay 404 and are asserted as such by
    `scripts/smoke-production.mjs`.
  license:
    name: See LICENSE.md

servers:
  - url: https://fqgpzhwvvfsxswlnbbgg.supabase.co
    description: production
  - url: https://yqjtawffpesplqyurlpj.supabase.co
    description: e2e

tags:
  - name: evidence
    description: Appending to and reading the chain. Live.
  - name: invitation
    description: Offering and accepting an agreement. Live.
  - name: access
    description: Replacing a counterparty's credential. Live.
  - name: delegation
    description: Letting an agent act for an owner. PROPOSED, not built.

security:
  - anonKey: []

paths:

  /functions/v1/log-event:
    post:
      tags: [evidence]
      operationId: logEvent
      summary: Append one event to an agreement's chain.
      x-trustflow-status: live
      description: |
        The general writer for party-asserted events. (NOT the only writer to
        `events`: `validate-invite-token` and `reissue-guest-access` each append
        inside their own RPC. log-event's own header comment still says "the
        only writer" and is stale — reported, not changed.) A caller supplies `type`, `contract_id`,
        `payload` and optionally `idempotency_key`. Everything that makes the
        row evidence is derived server-side: `actor_id` from the presented
        credential, `created_at` from the server clock, `dod_hash` and
        `agreement_hash` from the agreement, `prev_event_hash` from the current
        chain tip, and the authentication record from the verified credential.

        Authority comes from credentials only. An owner presents their Supabase
        JWT in `Authorization`; a counterparty presents `x-guest-access-token`.
        The actor must be a party to the contract, and the event type must match
        the actor's role in the deal: `performance.asserted` is the performer's
        to say, `performance.accepted` the receiver's.

        A contested chain tip is retried up to five times internally. Two
        concurrent writers cannot both commit against one predecessor:
        `events_chain_no_fork_idx` is unique on
        `(contract_id, prev_event_hash)`.
      parameters:
        - $ref: '#/components/parameters/GuestAccessToken'
        - $ref: '#/components/parameters/DelegationToken'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, contract_id]
              properties:
                type:
                  $ref: '#/components/schemas/PartyAssertableEventType'
                contract_id:
                  type: string
                  format: uuid
                  description: |
                    Must be a UUID and must exist. Marketplace fixture ids
                    ('1', 'mock') are refused by design.
                payload:
                  type: object
                  description: |
                    What this party asserts. At most 16 KiB serialized.
                    Underscore-prefixed keys are stripped: they are the server's
                    namespace for derived facts.
                  additionalProperties: true
                idempotency_key:
                  type: string
                  nullable: true
                  description: |
                    Scoped to an operation, not to a contract: a hit is a replay
                    only when contract, key, type AND actor all match
                    (`_shared/eventWriteRules.ts:43-50`). Same key, different
                    operation answers 409 `idempotency_key_in_use` — it does not
                    return the other party's event.

                    PROPOSED, and load-bearing: under a delegation the
                    COMPARISON gains the delegation, because `actor_id` stays the
                    owner and would otherwise let one of an owner's agents be
                    handed an event written by another. The uniqueness NAMESPACE
                    does not change: `events_idempotency_idx` stays unique on
                    `(contract_id, idempotency_key)`, so one key per contract per
                    operation whoever presents it, and a key already spent under
                    another delegation answers 409 `idempotency_key_in_use`
                    instead of replaying. Extending the index itself would have
                    lost uniqueness for human-session writes, since a plain
                    unique index never treats two NULLs as equal.

                    The replay lookup also moves to AFTER the delegation checks —
                    today the function returns an existing event before any
                    insert (`index.ts:293-305`), so a trigger-based TF006 would
                    never fire on a replay. See
                    docs/proposals/agent-first-access.md section 4.1.
                dod_hash:
                  description: |
                    Refused, not ignored. The terms an assertion refers to are
                    derived from the agreement; a caller offering its own value
                    is either confused or pinning its assertion to terms nobody
                    agreed.
      responses:
        '201':
          description: Appended.
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    $ref: '#/components/schemas/Event'
                  deduplicated:
                    type: boolean
        '200':
          description: Replay of this caller's own earlier write under the same key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    $ref: '#/components/schemas/Event'
                  deduplicated:
                    type: boolean
        '400':
          description: |
            `invalid_body`, `type_not_allowed`, `type_retired`,
            `type_is_server_recorded`, `missing_contract_id`, `invalid_payload`,
            `dod_hash_is_server_derived`, `invalid_idempotency_key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            `not_a_party`, `wrong_party_for_event_type`, or
            `guest_credential_revoked` — deliberately distinct from
            `not_a_party`, so a revocation taking effect is visible in the log.
            PROPOSED: `approval_required`, `delegation_scope_insufficient`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`contract_not_found`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            `idempotency_key_in_use` (never retry), `contract_deleted` (TF002 —
            the agreement went away mid-write), `clock_behind_chain` (TF003 —
            this isolate's clock is not ahead of the chain tip),
            `chain_contention` (retry), and `wrong_state_for_event_type`
            (TF001 — the agreement is not in a state where this type may be
            appended; carries `detail` and a nullable `hint` straight from the
            database, `index.ts:489-494`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: '`payload_too_large` — over 16 KiB.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: |
            `lookup_failed`, `insert_failed`, and `internal_error` — the
            catch-all at `index.ts:538`, which carries the thrown value as
            `detail`. TF005 — a write attempted at an unsupported transaction
            isolation level — surfaces here and is logged server-side as a
            configuration fault. It must never be retried, and its appearance
            means a release is not complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /functions/v1/validate-invite-token:
    post:
      tags: [invitation]
      operationId: validateInviteToken
      summary: Read an invitation, or accept it.
      x-trustflow-status: live
      description: |
        Two operations behind one path, selected by `accept`.

        Without `accept`, it returns the agreement the invitation refers to,
        read from the contract row, and consumes nothing. The URL carries only
        the token and never the terms, so a tampered URL cannot change what the
        counterparty is shown.

        With `accept: true`, one server-side transaction consumes the one-time
        token, records the accepting identity, moves the agreement to
        TERMS_ACCEPTED, issues the `guest_access_token`, and appends the
        acceptance evidence carrying the agreed terms. All of it commits or none
        does, so a caller holding a 200 has both the acceptance and the record
        of what was accepted.

        `shown_terms_digest` is the terms the client actually displayed. The
        server recomputes the digest from the row it is about to hash and
        refuses on a mismatch, so an edit made while the invitation sat on
        screen cannot be recorded as what the counterparty agreed to. It is not
        a credential: the caller computes it, so it protects an honest guest
        from an honest edit and nothing more.

        **Whether it is optional depends on the currency, and an earlier
        version of this description was wrong about it.** On a `JPY` contract
        the check binds only when a non-empty digest is supplied — omit it, or
        send `""` or `null`, and acceptance proceeds with no comparison. On any
        other currency a digest at `shown_terms_version` 2 or above is
        **required**, and its absence is `409 terms_check_unsupported`: under
        version 1 the amount of a non-JPY agreement is not covered at all, so
        its price could change without the digest moving.

        **The algorithm, its exact preimage and a reference digest are
        specified in `docs/api/agent-protocol.md`**, which also states how an
        invitation is expected to reach the accepting party — TrustFlow does
        not deliver one. A client cannot accept a non-JPY agreement without
        implementing that digest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_token]
              properties:
                invite_token:
                  type: string
                  format: uuid
                accept:
                  type: boolean
                  default: false
                hirer_email:
                  type: string
                  format: email
                  description: |
                    Required when accepting. SELF-ASSERTED and recorded as
                    unverified: nothing proves the accepting party controls this
                    address. Stored separately from `invited_hirer_email`
                    precisely because the two may differ.
                counterparty_name:
                  type: string
                  nullable: true
                shown_terms_digest:
                  type: string
                  nullable: true
                  description: |
                    Lowercase hex SHA-256 of the terms this client was shown.
                    Computed by the caller — see docs/api/agent-protocol.md for
                    the exact field set and serialization. Required for every
                    currency except JPY.
                shown_terms_version:
                  type: integer
                  description: |
                    The format the caller computed, as the caller names it. A
                    current server verifies 1 and 2; send 2. Below 2 on a
                    non-JPY contract is refused with terms_check_unsupported.
      responses:
        '200':
          description: The invitation, or the completed acceptance.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/InvitePreview'
                  - $ref: '#/components/schemas/AcceptanceResult'
                description: |
                  Which one you get follows the request: no `accept` gives the
                  preview, `accept: true` gives the result. The two are made
                  genuinely exclusive by their `required` lists —
                  `guest_access_token` is present on one and forbidden on the
                  other — because without that a validator would accept either
                  body as both and `oneOf` would always fail.
        '400':
          description: |
            `missing invite_token`, `valid hirer_email required`. NOTE: these
            two reasons contain spaces where the rest of the API is snake_case.
            `scripts/smoke-production.mjs` asserts the first literally, so they
            are kept as-is; aliases are proposed rather than renames.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`not_found` — no such invitation, or it was withdrawn by deleting the draft.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            `terms_changed` (the row moved under the screen),
            `terms_check_unsupported`, `clock_behind_chain`, `chain_contention`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: |
            `expired` (past the 72h window) or `already_used` — distinct on
            purpose: telling someone their link "did not work" when they are the
            one who used it sends them back for a replacement nobody should
            issue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: '`lookup_failed`, `accept_failed`, `internal_error` (the catch-all at `index.ts:301`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /functions/v1/guest-contract-events:
    post:
      tags: [evidence]
      operationId: guestContractEvents
      summary: The counterparty's view of the record.
      x-trustflow-status: live
      description: |
        Resolves the agreement from `x-guest-access-token` alone — the contract
        is never named in the request, so there is no id for a caller to swap.

        The response is a shaped view, not raw rows: payloads are allowlisted
        per event type, hash and chain verification are reported per event, and
        the `verification` block states what the counterparty can and cannot
        establish from it. An event type the projection has not been taught
        about appears with an empty payload rather than passing through.

        Returns at most 500 events, oldest first. `chain.truncated` means **the
        cap was reached**, not "there is more": an agreement with exactly 500
        events returns `truncated: true` with nothing left behind it. There is
        no cursor today, so beyond 500 the rest is unreachable; see the
        `after`/`next` proposal in docs/proposals/agent-first-access.md
        section 4.3.
      parameters:
        - $ref: '#/components/parameters/GuestAccessTokenRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                after:
                  type: string
                  description: 'PROPOSED, not implemented: "<created_at>|<id>" cursor.'
                limit:
                  type: integer
                  default: 100
                  maximum: 500
                  description: 'PROPOSED, not implemented.'
      responses:
        '200':
          description: The shaped record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestRecord'
        '401':
          description: '`missing_guest_token`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`invalid_guest_token`, `guest_token_expired`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: '`lookup_failed`, `events_lookup_failed`, `internal_error`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /functions/v1/reissue-guest-access:
    post:
      tags: [access]
      operationId: reissueGuestAccess
      summary: Give the counterparty a working credential again.
      x-trustflow-status: live
      description: |
        Owner authority only, re-checked inside the transaction. Overwrites
        `guest_access_token`, restarts the 90-day window, and appends
        `access.reissued` in the same transaction — which is how a reader knows
        the events after it may not be the same person as the ones before.

        It is also the only way to withdraw a leaked guest credential, and it is
        NOT instant: a request already in flight was authorised against a
        credential re-read one round trip before its write, so it can still
        land. The window is narrow and it is not zero, and no response, UI or
        document may claim otherwise.

        Deliberately not an email match on `hirer_email`: that address is typed
        by the counterparty at acceptance and recorded as unverified.
      security:
        - ownerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contract_id]
              properties:
                contract_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: A fresh credential. Deliver it the way the invitation was delivered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  contract_id:
                    type: string
                    format: uuid
                  guest_access_token:
                    type: string
                    format: uuid
                  expires_at:
                    type: string
                    format: date-time
                  event_id:
                    type: string
                    format: uuid
                    nullable: true
        '400':
          description: '`invalid_body`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`not_the_owner`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`contract_not_found`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            `not_accepted` — before acceptance there is no counterparty to issue
            to, and the invitation is still the right thing to re-share. Also
            `clock_behind_chain`, `chain_contention`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: '`lookup_failed`, `reissue_failed`, `internal_error` (the catch-all at `index.ts:218`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /rest/v1/contracts:
    post:
      tags: [invitation]
      operationId: createContract
      summary: Create an agreement (PostgREST).
      x-trustflow-status: live
      description: |
        A verified (non-anonymous) account session only:
        `verified_earner_only_insert`. The client holds INSERT on exactly nine
        columns — `project_name`, `dod`, `amount_minor`, `amount_jpy`,
        `currency`, `deadline`, `invited_hirer_email`, `earner_display_name`,
        `earner_user_id`, `performed_by` — and sending any other column fails the whole insert
        with 403. `state`, `invite_token` (and its 72h expiry),
        `guest_access_token`, `hirer_email`, `dod_hash` and every payment column
        are server-owned.

        There is no UPDATE grant and no UPDATE policy on this table, for any
        column, so nothing here can be corrected afterwards from a client. See
        docs/proposals/web-ux-waiting-and-wrong-email.md section 2.3.
      security:
        - ownerJwt: []
      parameters:
        - $ref: '#/components/parameters/PreferRepresentation'
        - $ref: '#/components/parameters/AcceptSingleObject'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [earner_user_id, project_name, dod, amount_minor, currency, performed_by]
              additionalProperties: false
              description: |
                Exactly the nine columns the client holds INSERT on. Sending any
                other column fails the whole insert with 403, which is why this
                schema is closed rather than open. `dod_hash` in particular is
                NOT sent: it is derived server-side, and the grant on it was
                revoked so that a party cannot record a terms-hash that
                disagrees with its own terms (src/lib/contracts.js:54-74).
              properties:
                earner_user_id:
                  type: string
                  format: uuid
                  description: Must be the caller's own `auth.uid()`.
                earner_display_name:
                  type: string
                  nullable: true
                project_name:
                  type: string
                dod:
                  type: array
                  items:
                    type: string
                amount_minor:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                  description: |
                    The amount as an integer in `currency`'s MINOR unit: yen
                    for JPY, cents for CAD/HKD/USD/EUR/GBP. CA$12.50 is 1250.
                    There is no decimal form on the wire and no FX anywhere.
                    Rejected as `amount_not_an_integer`, `amount_not_positive`
                    or `amount_too_large`
                    (supabase/functions/_shared/money.ts).
                amount_jpy:
                  type: integer
                  nullable: true
                  description: |
                    DEPRECATED 2026-11-08 and transitional. REQUIRED and equal
                    to `amount_minor` when `currency` is JPY; must be ABSENT or
                    null for any other currency. A database CHECK enforces both
                    directions, so a cent amount cannot be stored in a column
                    named after yen. Drop it from a request once the column is
                    dropped.
                currency:
                  type: string
                  enum: [JPY, CAD, HKD, USD, EUR, GBP]
                  default: JPY
                  description: |
                    ISO 4217. Append-only: the list is
                    `SUPPORTED_CURRENCIES` in
                    supabase/functions/_shared/money.ts, mirrored by
                    `contracts_currency_check`. Anything else is
                    `currency_unsupported`.
                deadline:
                  type: string
                  format: date
                  nullable: true
                invited_hirer_email:
                  type: string
                  nullable: true
                  description: |
                    The address the invitation is MEANT for. Not in the hashed
                    agreement snapshot, and not corrigible afterwards.
                performed_by:
                  type: string
                  enum: [creator, counterparty]
      responses:
        '201':
          description: |
            Created. **TWO headers are needed, not one.**
            `Prefer: return=representation` is what makes PostgREST send a body
            at all — without it the response is empty and there is no
            `invite_token` and no id to show the user. `Accept:
            application/vnd.pgrst.object+json` is what makes that body a single
            object rather than an array of one, which is why the schema below is
            an object. `src/lib/contracts.js` gets both by chaining
            `.select().single()`: the client sets the Prefer header for
            `.select()` and the Accept header inside `.single()`
            (`@supabase/postgrest-js`, `PostgrestTransformBuilder`). A caller
            sending only `Prefer` gets a one-element array and cannot read
            `response.invite_token`.
          content:
            application/json:
              schema:
                type: object
                description: The contract row, including `invite_token` and `invite_token_expires_at`.
        '403':
          description: Anonymous session, or a server-owned column was sent.
    get:
      tags: [invitation]
      operationId: listContracts
      summary: Agreements the caller is a party to.
      x-trustflow-status: live
      description: |
        No client-side filter is applied or needed:
        `parties_read_own_contracts` restricts rows to
        `auth.uid() = earner_user_id OR auth.uid() = hirer_user_id`. The policy
        is the control — which is also why this endpoint is useless to a
        delegated agent: with the anon key in `Authorization`, `auth.uid()` is
        null and the policy admits nothing
        (docs/proposals/agent-first-access.md section 1.5).
      security:
        - ownerJwt: []
      responses:
        '200':
          description: Rows visible to this party.
    delete:
      tags: [invitation]
      operationId: deleteDraftContract
      summary: Withdraw a draft nobody has accepted.
      x-trustflow-status: live
      description: |
        `owner_delete_unaccepted_draft`: the caller's own contract, still
        AWAITING_ACCEPTANCE, with an unused invite token, AND carrying no
        events. The last clause matters — evidence can exist on an unaccepted
        agreement, and deleting it would destroy the only copy.

        A concurrent append is refused under a row lock with SQLSTATE TF004
        rather than orphaning the evidence.
      security:
        - ownerJwt: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            pattern: '^eq\.[0-9a-fA-F-]{36}$'
          description: |
            PostgREST filter, `id=eq.<uuid>`. **Required in practice:** a DELETE
            with no filter asks to delete every row the policy admits.
            `src/lib/contracts.js:367-368` always sends it.
        - $ref: '#/components/parameters/PreferCountExact'
      responses:
        '200':
          description: |
            Zero or one row deleted. The count is the only way to tell a refusal
            from "already gone", and it arrives in the **`Content-Range`
            response header** (`0-0/1` or `*/0`) — not in the body — and only
            when `Prefer: count=exact` was sent. The Supabase client's
            `.delete({ count: 'exact' })` is what sends it.
          headers:
            Content-Range:
              schema:
                type: string
              description: '`*/0` when nothing was deleted; `0-0/1` when one row was.'
        '400':
          description: |
            TF004 — evidence appeared while this delete was in flight, so the
            DELETE itself is refused (not the append). PostgREST surfaces it as
            HTTP **400** with its own `{code,message,details,hint}` body, not as
            the Edge Functions' `{error}` shape — measured in Task 3
            (.ada/claude-report-3.md:229). `src/lib/contracts.js:342` reads
            `error.code`.

  /rest/v1/events:
    get:
      tags: [evidence]
      operationId: listEvents
      summary: Raw events for an agreement (owner side).
      x-trustflow-status: live
      description: |
        Read under `party_read_contract_events`, which reaches events through an
        EXISTS on `contracts` — so if the parent agreement is gone, its events
        are invisible to the owner even if rows remain. UPDATE and DELETE are
        rewritten to do nothing (`no_update_events`, `no_delete_events`): a
        DELETE here succeeds and deletes nothing.
      security:
        - ownerJwt: []
      responses:
        '200':
          description: Events, ordered by the caller.

  /functions/v1/delegations:
    post:
      tags: [delegation]
      operationId: issueDelegation
      summary: Issue a delegation so an agent can act for the owner.
      x-trustflow-status: proposed
      description: |
        PROPOSED. Owner authority only, verified exactly as
        `reissue-guest-access` verifies it. The secret is returned ONCE and only
        its SHA-256 is stored — a deliberate divergence from `invite_token` and
        `guest_access_token`, which are stored in plaintext.

        No event is written. Issuing a delegation is not a fact about any
        agreement; it becomes evidence the moment it is used. The authentication
        of the ISSUING SESSION is captured here, as `issuer_assurance`, and
        carried immutably into every event written under this delegation.

        What that proves is narrower than it looks, and the honest form matters:
        *TrustFlow issued this delegation on the authority of an authenticated
        session belonging to the owner, and recorded acts by its bearer.* It
        does NOT establish that the owner intended to delegate, that the secret
        was not later copied, or anything about any individual act — issuance
        has no act-bound challenge either. Do not read it as "the owner
        authorised this act".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  default: My agent
                  description: |
                    Owner-chosen free text, e.g. "Claude Code on Iris". No claim
                    is made that it names the software that actually ran.
                scopes:
                  type: array
                  default: [read, write]
                  items:
                    type: string
                    enum: [read, write, approve]
                  description: |
                    `read` is always implied. `approve` covers the acts that end
                    something — performance.accepted/rejected,
                    payment.acknowledged/disputed, deleting a draft — and is
                    never granted by default.
                contract_id:
                  type: string
                  format: uuid
                  nullable: true
                  default: null
                  description: 'null = every agreement of this owner; set = exactly one.'
                expires_in_days:
                  type: integer
                  default: 30
                  maximum: 365
      responses:
        '201':
          description: Created. `token` appears in this response and nowhere else, ever.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  token:
                    type: string
                    pattern: '^tfd_[A-Za-z0-9_-]{43}$'
                    description: Shown once. The prefix makes a leak greppable and recognisable to secret scanners.
                  label:
                    type: string
                  scopes:
                    type: array
                    items:
                      type: string
                  contract_id:
                    type: string
                    format: uuid
                    nullable: true
                  expires_at:
                    type: string
                    format: date-time
        '403':
          description: '`not_the_owner` — including any anonymous session.'
    get:
      tags: [delegation]
      operationId: listDelegations
      summary: The owner's delegations.
      x-trustflow-status: proposed
      description: PROPOSED. Never returns a token or a hash. `last_used_at` is the field an owner actually reads.
      responses:
        '200':
          description: Delegations, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Delegation'

  /functions/v1/delegations/{id}:
    delete:
      tags: [delegation]
      operationId: revokeDelegation
      summary: Revoke a delegation, exactly.
      x-trustflow-status: proposed
      description: |
        PROPOSED. Sets `revoked_at`. The withdrawal has an exact SERIALIZATION
        POINT, which is a narrower promise than "exact": no write is admitted
        under this delegation once the revoke has committed, while a write whose
        trigger already took the lock and passed will still commit.

        The mechanism: the event carries `delegation_id`, so a BEFORE INSERT
        trigger joins `delegations`, **locks that row** (`for update` or
        `for share` — `for key share` does NOT conflict with an UPDATE of the
        non-key `revoked_at`, which is exactly what revoke does), and re-tests
        liveness on the locked row inside the insert's own transaction. There is
        no shared lock with the existing guards, which lock `contracts`. The
        proposed SQLSTATE is TF006, in the family TF001-TF005. Expiry is judged
        against `now()`, i.e. transaction start, so a delegation that expires
        while the statement waits on the lock is still admitted — deliberate,
        and stated rather than discovered.

        A delegation cannot revoke itself.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Revoked. Idempotent.
        '403':
          description: '`not_the_owner`, or an attempt to revoke using the delegation being revoked.'
        '404':
          description: '`delegation_not_found`.'

components:

  securitySchemes:
    anonKey:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The project's LEGACY anon JWT (`VITE_SUPABASE_ANON_KEY`, an `eyJ…`
        token) — not a `sb_publishable_…` key, which this project does not use.
        It satisfies the platform gateway's verify_jwt check and identifies the
        project, not a person. Same header as `ownerJwt`, so the two are
        alternatives.
    ownerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A verified (non-anonymous) Supabase session, in the same
        `Authorization: Bearer` header as `anonKey` and therefore instead of it.
        Obtained through an emailed OTP behind a Cloudflare Turnstile challenge —
        which is exactly why an agent needs a delegation instead. Every
        operation below that requires it says so with its own `security`.

  parameters:
    GuestAccessToken:
      name: x-guest-access-token
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: |
        The counterparty's credential, issued when they consumed the invitation.
        Scoped to one agreement. Transferable, and the system says so: holding
        it does not show the holder is the invited party.
    GuestAccessTokenRequired:
      name: x-guest-access-token
      in: header
      required: true
      schema:
        type: string
        format: uuid
    DelegationToken:
      name: x-trustflow-delegation
      in: header
      required: false
      schema:
        type: string
        pattern: '^tfd_[A-Za-z0-9_-]{43}$'
      description: |
        PROPOSED. Not in `Authorization`, because the gateway validates that
        header before TrustFlow code runs. Must be added to
        Access-Control-Allow-Headers before any browser use.
    PreferRepresentation:
      name: Prefer
      in: header
      required: true
      schema:
        type: string
        enum: ['return=representation']
      description: |
        PostgREST returns no body without it, so the created row — and with it
        `invite_token` — would be lost. Marked required here because every
        caller in this codebase needs the row.
    AcceptSingleObject:
      name: Accept
      in: header
      required: true
      schema:
        type: string
        enum: ['application/vnd.pgrst.object+json']
      description: |
        Makes PostgREST answer with ONE object instead of an array of one, and
        turns "no row" into an error rather than an empty list. Required
        wherever this document shows a single-object response body.
    PreferCountExact:
      name: Prefer
      in: header
      required: false
      schema:
        type: string
        enum: ['count=exact']
      description: |
        Without it there is no count, and a refusal is indistinguishable from
        "already deleted". The count arrives in `Content-Range`, never in the
        body.
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: |
        PROPOSED as a header on every write, for uniformity. `log-event` honours
        the body field today; acceptance and reissue honour nothing.

  schemas:

    PartyAssertableEventType:
      type: string
      description: |
        WRITE INPUT ONLY — what a party may record about their own agreement.
        Reading an event back uses `RecordedEventType`, which is wider. The names are
        deliberate: a party asserting they performed is not the same fact as the
        work having been delivered, and TrustFlow can only attest the first.

        Refused with a reason that says which: `dod.consent_recorded` and
        `access.reissued` are server-recorded (`type_is_server_recorded`);
        `work.submitted`/`approved`/`rejected` are retired but still readable on
        historical rows (`type_retired`); every Stripe-verified payment name is
        absent on purpose and never assertable from a client.
      enum:
        - contract.initiated
        - contract.accepted
        - performance.asserted
        - performance.accepted
        - performance.rejected
        - contract.cancelled
        - contract.completed
        - dispute.opened
        - rating.submitted
        - payment.reported
        - payment.acknowledged
        - payment.disputed

    Event:
      type: object
      description: |
        One row of the chain. `event_hash` covers the type, actor, contract,
        terms pin, timestamp, predecessor, payload hash and agreement hash, so
        a later edit is detectable when the record is checked.

        What the chain does NOT provide: there is no third-party timestamp and
        no TSA token is written, so nothing in it outranks the operator of the
        server.
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/RecordedEventType'
        contract_id:
          type: string
          description: Text, with no foreign key to `contracts` — recorded debt.
        actor_id:
          type: string
          description: |
            The owner's user id, or `guest:<claimed email>` for a counterparty.
            PROPOSED: for a delegated write this stays the OWNER. An agent is
            not a party; it is how a party acted, and that lives in
            `payload._authentication.delegation`.
        created_at:
          type: string
          format: date-time
          description: |
            The server's clock, inside the event hash, and therefore impossible
            to correct later. It must be strictly later than its predecessor's
            or the write is refused with TF003.
        dod_hash:
          type: string
        agreement_hash:
          type: string
          description: |
            SHA-256 over project name, completion criteria, amount, currency,
            deadline, which side performs, and the offering party. NEITHER email
            address is in it.
        payload:
          type: object
          additionalProperties: true
        payload_hash:
          type: string
        prev_event_hash:
          type: string
        event_hash:
          type: string
        hash_version:
          type: integer
        idempotency_key:
          type: string
          nullable: true
        delegation_id:
          type: string
          format: uuid
          nullable: true
          description: |
            PROPOSED, and the one schema change this feature needs. Null on
            every row written to date and on every human-session write. It
            exists because `actor_id` stays the owner, so nothing else
            distinguishes one of an owner's agents from another: the idempotency
            COMPARISON reads it, and so does the TF006 trigger. The unique index
            is NOT extended to include it — a plain unique index treats two
            NULLs as distinct, which would silently drop the uniqueness every
            human-session write has today.

    RecordedEventType:
      type: string
      description: |
        The type as STORED and read back, which is a wider set than a client may
        write. Deliberately not an enum: the log is append-only, so names that
        were accepted once stay readable for ever and a closed list here would
        make a valid historical row fail validation.

        Beyond `PartyAssertableEventType` it includes the server-recorded types
        `dod.consent_recorded` and `access.reissued`
        (`log-event/index.ts:107`), which a client offering them is refused for
        with `type_is_server_recorded`, and the retired
        `work.submitted` / `work.approved` / `work.rejected`
        (`:114`), refused with `type_retired`. Payment names verified by Stripe
        may also appear on historical rows and were never client-assertable.
      examples:
        - performance.asserted
        - dod.consent_recorded
        - access.reissued
        - work.submitted

    AuthenticationRecord:
      type: object
      description: |
        `payload._authentication`. What the record is entitled to claim about
        how the actor authenticated, and — as data, not as a footnote — what it
        is not.
      properties:
        assurance:
          type: string
          enum: [account_session, bearer_capability, anonymous, delegated_authority]
          description: '`delegated_authority` is PROPOSED. An anonymous session must never reach an evidence write.'
        credential:
          type: string
          nullable: true
          enum: [account_jwt, invite_token, guest_access_token, delegation_token]
          description: '`delegation_token` is PROPOSED.'
        method:
          type: string
          nullable: true
          description: "From the JWT's amr: 'otp', 'magiclink', 'password'."
        aal:
          type: string
          nullable: true
          description: Supabase's own level, recorded verbatim and not interpreted.
        seconds_since_authentication:
          type: integer
          nullable: true
          description: |
            A session outlives its access token through refresh, so "signed in
            at some point" and "signed in moments ago" are different facts and
            only this number tells them apart. It is a fact about the SESSION,
            not about the act. The absolute sign-in time is deliberately NOT
            stored: `created_at` minus this reproduces it, so keeping only the
            relative figure loses nothing and writes one less dated fact about
            a person into permanent storage.
        recent_authentication:
          type: boolean
        recent_authentication_window_seconds:
          type: integer
          description: The threshold the boolean was judged against, carried with it so it stays readable if the constant changes.
        act_bound_authentication:
          type: boolean
          description: |
            Always false, and a RECORDED false rather than an absent field, so a
            reader can see the question was asked and answered negatively.
            Making it true needs a server-issued nonce bound to this
            agreement_hash and this action. No such mechanism exists, so no
            amount of recency may be read as intent. This is the honest boundary
            between a signature and consent given through an authenticated
            session.
        act_binding_mechanism:
          type: 'null'
        delegation:
          $ref: '#/components/schemas/DelegationRecord'

    DelegationRecord:
      type: object
      nullable: true
      description: |
        PROPOSED. Present only on a delegated write. The honest reading is: the
        BEARER of delegation `id` — issued on the authority of an authenticated
        session of this owner at `issued_at`, under the owner-chosen label
        `label`, scoped `scopes` — asserted this at the event's `created_at`. It
        does NOT show that the owner saw or intended the act, that the agent did
        what the owner asked, or that the label names the software that ran.

        `issuer_assurance.seconds_since_authentication` is measured from
        `issued_at`, NOT from the event's `created_at`: the two intervals
        (session→issuance, issuance→act) are different numbers and a receipt
        that conflates them overstates how recently a human was present.

        The counterparty sees `id` and `label` (Kenji's decision, 2026-11-08),
        projected as their own block by `guest-contract-events` rather than
        through the payload allowlist, with the label described to them as a
        name the owner chose. `scopes` and `issuer_assurance` stay owner-only.
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        scopes:
          type: array
          items:
            type: string
        contract_scoped:
          type: boolean
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        issuer_assurance:
          $ref: '#/components/schemas/AuthenticationRecord'

    Delegation:
      type: object
      description: PROPOSED. Never carries the token or its hash.
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        scopes:
          type: array
          items:
            type: string
        contract_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true

    InvitePreview:
      type: object
      description: Everything from the contract row. Consumes nothing.
      required: [contract_id, project_name]
      not:
        required: [guest_access_token]
      properties:
        contract_id:
          type: string
          format: uuid
        project_name:
          type: string
        dod:
          type: array
          items:
            type: string
        amount_minor:
          type: integer
          description: Integer in `currency`'s minor unit — yen for JPY, cents otherwise.
        amount_jpy:
          type: integer
          nullable: true
          description: Deprecated mirror; null unless `currency` is JPY.
        currency:
          type: string
          enum: [JPY, CAD, HKD, USD, EUR, GBP]
        deadline:
          type: string
          format: date
          nullable: true
        earner_display_name:
          type: string
          nullable: true
        invited_hirer_email:
          type: string
          nullable: true
        performed_by:
          type: string
          enum: [creator, counterparty]
          description: |
            Which side does the work. Bound into the agreement snapshot at
            acceptance, so it has to be on screen before anyone agrees —
            attesting consent to a term nobody was shown would be dishonest.

    AcceptanceResult:
      type: object
      required: [contract_id, guest_access_token, acceptance_event_id]
      properties:
        contract_id:
          type: string
          format: uuid
        project_name:
          type: string
        dod:
          type: array
          items:
            type: string
        amount_minor:
          type: integer
          description: Integer in `currency`'s minor unit — yen for JPY, cents otherwise.
        amount_jpy:
          type: integer
          nullable: true
          description: Deprecated mirror; null unless `currency` is JPY.
        currency:
          type: string
          enum: [JPY, CAD, HKD, USD, EUR, GBP]
        deadline:
          type: string
          format: date
          nullable: true
        earner_display_name:
          type: string
          nullable: true
        guest_access_token:
          type: string
          format: uuid
          description: The counterparty's only credential. It lives in their browser and nowhere else recoverable.
        acceptance_event_id:
          type: string
          format: uuid
          description: 'Stated so a client never has to assume it: the record exists because this response does, and there is no second call to make.'

    GuestRecord:
      type: object
      properties:
        accepted_agreement:
          type: object
          nullable: true
          description: What was ACCEPTED, from the acceptance event rather than the current row. Null for agreements accepted before the snapshot existed — absent, not reconstructed.
        terms_changed_since_acceptance:
          type: array
          nullable: true
          items:
            type: string
          description: Terms on which the current row and the accepted agreement disagree. Empty when they match; null when there is no snapshot to compare.
        acceptance_identity:
          type: object
          nullable: true
          description: |
            Kept apart on purpose: an invitation can be forwarded, and the
            divergence is itself evidence. Neither address is verified. NOTE
            this block sits OUTSIDE the per-event payload allowlist, so what it
            exposes has to be checked explicitly.
          properties:
            invited_recipient:
              type: string
              nullable: true
            claimed_identity:
              type: string
              nullable: true
            claimed_identity_verified:
              type: boolean
            authentication:
              type: string
              nullable: true
            authentication_detail:
              $ref: '#/components/schemas/AuthenticationRecord'
        contract:
          type: object
        events:
          type: array
          items:
            type: object
        verification:
          type: object
          description: What the counterparty can establish from this response, and what no amount of hashing in it will establish. Carried in the data because a machine reader has no README.
        chain:
          type: object
          properties:
            event_count:
              type: integer
            server_attested:
              type: integer
            client_asserted:
              type: integer
            verified:
              type: boolean
              description: True only if every row carrying the material to be checked checks out. Rows with nothing to verify do not count as verified.
            truncated:
              type: boolean
              description: |
                The 500 cap was REACHED. True at exactly 500 events even when
                none were left out, so it is not a reliable "more exists" flag.
                PROPOSED: `next !== null` answers the question `truncated` only
                approximates, and `truncated` stays for existing readers.
            payload_covered_by_hash:
              type: boolean
              description: Whether the detail fields are tamper-evident. Events written before the payload-binding canonical are covered for authorship and timing but not for substance.
            next:
              type: string
              nullable: true
              description: PROPOSED cursor. A paged response can only report that this page links to the previous one, and must say so rather than narrow the claim quietly.

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            The server's own reason, verbatim. A client that collapses these
            into one generic string hides bugs for weeks — this project lost two
            to exactly that, so the reason is never flattened.
        detail:
          type: string
          description: Free text. Present on some 409s and 500s.
        hint:
          type: string
          nullable: true
          description: |
            Passed through from the database on `wrong_state_for_event_type`
            (log-event/index.ts:493), where it is explicitly nullable. No other
            reason sets it.
        retryable:
          type: boolean
          description: |
            PROPOSED. `chain_contention` and `clock_behind_chain` are retryable;
            `idempotency_key_in_use`, `wrong_party_for_event_type`,
            `guest_credential_revoked`, `already_used` and `approval_required`
            never are. Today a caller must know this from prose — a human reads
            the docs, an agent guesses.
        where:
          type: string
          description: PROPOSED. Which function answered.
        docs:
          type: string
          format: uri
          description: PROPOSED.
